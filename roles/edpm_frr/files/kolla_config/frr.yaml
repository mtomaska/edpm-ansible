---
command: >-
  bash -c $* -- eval if [ -f /usr/libexec/frr/frrinit.sh ]; then /usr/libexec/frr/frrinit.sh start; else /usr/lib/frr/frr start; fi  && exec /bin/sleep infinity
permissions:
  - path: /etc/frr
    owner: frr:frrvty
    recurse: true
  - path: /run/frr
    owner: frr:frrvty
    recurse: true
